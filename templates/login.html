<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | PHINMA UI Smart Parking</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{display:flex;flex-direction:column;min-height:100vh}
nav{background:#004b6b;padding:15px 40px;display:flex;justify-content:center;align-items:center}
.logo{color:#fff;font-weight:bold;font-size:18px;text-align:center}
.hero{flex:1;display:flex;justify-content:center;align-items:center;padding:60px 40px}
.login-card{background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);padding:40px;border-radius:18px;width:100%;max-width:420px;box-shadow:0 25px 55px rgba(0,0,0,0.3)}
.login-card h2{text-align:center;margin-bottom:25px;color:#004b6b}
.login-card label{font-size:13px;display:block;margin-bottom:5px;font-weight:600}
.login-card input{width:100%;padding:12px;margin-bottom:15px;border-radius:8px;border:1px solid #ccc;transition:0.2s}
.login-card input:focus{border-color:#facc15;outline:none}
.login-card button{width:100%;padding:13px;background:linear-gradient(135deg,#ffcc00,#facc15);border:none;border-radius:8px;font-weight:bold;cursor:pointer;transition:0.3s;font-size:15px}
.login-card button:hover{transform:scale(1.03)}
.alert{padding:10px;margin-bottom:15px;border-radius:6px;font-size:14px;text-align:center;transition:opacity 0.5s ease}
.alert.success{background:#16a34a;color:white}
.alert.danger{background:#ef4444;color:white}
.alert.warning{background:#f59e0b;color:white}
.alert.info{background:#0ea5e9;color:white}
.login-card p{text-align:center;margin-top:15px;font-size:14px}
.login-card a{color:#004b6b;font-weight:bold}
footer{background:#002a3b;color:white;text-align:center;padding:15px 0;margin-top:auto}
</style>
</head>
<body>

<nav>
<div class="logo">PHINMA UI — Smart Parking System</div>
</nav>

<header class="hero">
<div class="login-card">

<h2>Login</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category, message in messages %}
<div class="alert {{ category }}">{{ message }}</div>
{% endfor %}
{% endif %}
{% endwith %}

<form method="POST" action="{{ url_for('login') }}">
<label>Email Address</label>
<input type="email" name="email" placeholder="Enter your email" required>

<label>Password</label>
<input type="password" name="password" placeholder="Enter your password" required>

<button type="submit">Login</button>
</form>

<p>Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>

</div>
</header>

<footer>
<p>&copy; 2026 PHINMA UI Smart Parking System</p>
</footer>

<script>
setTimeout(function(){
  document.querySelectorAll('.alert').forEach(function(el){
    el.style.opacity = '0';
    setTimeout(function(){ el.style.display = 'none'; }, 500);
  });
}, 3000);
</script>

</body>
</html>
