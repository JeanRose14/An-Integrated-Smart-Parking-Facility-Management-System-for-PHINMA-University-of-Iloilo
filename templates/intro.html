<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PHINMA UI Smart Parking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
        body{display:flex;flex-direction:column;min-height:100vh}
        nav{background:#004b6b;padding:15px 40px;display:flex;justify-content:center;align-items:center}
        .logo{font-size:18px;font-weight:bold;color:#fff;text-align:center}
        .hero{flex:1;min-height:64vh;display:flex;justify-content:center;align-items:center;text-align:center;padding:60px 20px}
        .hero-content{color:#fff;max-width:640px}
        .hero h1{font-size:40px;margin-bottom:10px;line-height:1.2}
        .hero .sub{font-size:16px;margin-bottom:8px;opacity:0.9}
        .hero p{margin-bottom:28px;font-size:15px;opacity:0.8}
        .btn-group{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
        .btn{background:#ffcc00;color:#000;padding:12px 28px;text-decoration:none;border-radius:10px;font-weight:bold;transition:0.3s;display:inline-block}
        .btn:hover{background:#e6b800;transform:translateY(-2px)}
        .btn-outline{background:transparent;border:2px solid #ffcc00;color:#ffcc00}
        .btn-outline:hover{background:#ffcc00;color:#000}
        footer{background:#002a3b;color:white;text-align:center;padding:15px 0;margin-top:auto}
    </style>
</head>
<body>
    <nav>
        <div class="logo">PHINMA UI — Smart Parking System</div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>Smart Parking<br>for PHINMA University</h1>
            <div class="sub">RFID-based vehicle tracking &amp; real-time monitoring</div>
            <p>Automated entry and exit logging with real-time parking analytics.</p>
            <div class="btn-group">
                <a href="{{ url_for('login') }}" class="btn">Login</a>
                <a href="{{ url_for('register') }}" class="btn btn-outline">Get Started</a>
            </div>
        </div>
    </header>

    <footer>
        <p>&copy; 2026 PHINMA UI Smart Parking System</p>
    </footer>
</body>
</html>
